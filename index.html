"use strict";

const DIVISIONS=[
["Minimumweight",105],["Light Flyweight",108],["Flyweight",112],["Super Flyweight",115],["Bantamweight",118],["Super Bantamweight",122],["Featherweight",126],["Super Featherweight",130],["Lightweight",135],["Super Lightweight",140],["Welterweight",147],["Super Welterweight",154],["Middleweight",160],["Super Middleweight",168],["Light Heavyweight",175],["Cruiserweight",200],["Heavyweight",null]
];
const STYLES=["Boxer","Swarmer","Slugger","Out-boxer","Counterpuncher","Boxer-puncher"];
const TACTICS={Balanced:{label:"Balanced",atk:1,def:1,stam:1,hit:1},Aggressive:{label:"Aggressive",atk:1.24,def:.78,stam:1.35,hit:1.08},Defensive:{label:"Defensive",atk:.78,def:1.3,stam:.82,hit:.92},Counterpunching:{label:"Counterpunching",atk:.91,def:1.15,stam:.9,hit:1.18}, "Body attack":{label:"Body attack",atk:1.02,def:.91,stam:1.08,hit:1.02}, "Movement-focused":{label:"Movement-focused",atk:.83,def:1.22,stam:1.12,hit:.95}};
const STYLEMOD={
"Boxer":{Technique:8,Accuracy:5,Defense:3},"Swarmer":{Stamina:9,Speed:5,Clinch:2,Defense:-3},"Slugger":{Power:12,Chin:5,Speed:-5,Accuracy:-3},"Out-boxer":{Speed:8,Defense:8,Technique:4,Power:-3},"Counterpuncher":{Counterpunching:12,Defense:5,Accuracy:3,Stamina:-2},"Boxer-puncher":{Power:5,Technique:5,Accuracy:4}
};
const ATTRS=["Power","Speed","Accuracy","Defense","Chin","Stamina","Recovery","Counterpunching","Clinch","Technique"];
const FIRST=["Jasur","Aziz","Bekzod","Sardor","Islom","Temur","Kamron","Rustam","Diyor","Akmal","Muhammad","Otabek","Daniel","Marco","Leon","Victor","Andre","Milan","David","Alex"];
const LAST=["Karimov","Rasulov","Tursunov","Aliyev","Yusupov","Nazarov","Petrov","Santos","Williams","Johnson","Khan","Garcia","Novak","Miller","Brown","Silva","Ivanov","Okafor","Costa","Reyes"];
const COUNTRIES=["Uzbekistan","USA","Mexico","Kazakhstan","United Kingdom","Japan","Cuba","Ukraine","Brazil","Philippines","Turkey","France"];
const CITIES=["Tashkent","Samarqand","Buxoro","Andijon","Namangan","London","Las Vegas","Mexico City","Almaty","Tokyo","Havana","Manila"];
const VENUES=["Toshkent Arena","Millennium Stadium","Grand Boxing Hall","Las Vegas Pavilion","National Sports Palace","Champions Dome","Royal Fight Center"];
const ORGS=["WBA","WBC","IBF","WBO"];
const money=n=>"$"+Math.round(n).toLocaleString("en-US");
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const int=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const avg=a=>a.reduce((x,y)=>x+y,0)/(a.length||1);
function blankState(){return {version:2,player:null,world:[],year:2026,month:1,activeFight:null,offers:[],news:[],events:[],ledger:[],sponsors:[],rivalries:[],champions:{},rankings:{},bestRank:null,retired:false,settings:{autosave:true,aiPerMonth:9},history:[],lastAutosave:null,processedFightIds:[],financeMonth:null};}
function normalizeSave(x){if(!x||typeof x!=="object"||!x.player||!Array.isArray(x.world))throw Error("Save tuzilmasi noto‘g‘ri");x.version=3;x.processedFightIds=Array.isArray(x.processedFightIds)?x.processedFightIds:[];x.ledger=Array.isArray(x.ledger)?x.ledger:[];x.history=Array.isArray(x.history)?x.history:[];x.news=Array.isArray(x.news)?x.news:[];x.events=Array.isArray(x.events)?x.events:[];x.offers=Array.isArray(x.offers)?x.offers:[];x.sponsors=Array.isArray(x.sponsors)?x.sponsors:[];x.rivalries=Array.isArray(x.rivalries)?x.rivalries:[];x.champions=x.champions&&typeof x.champions==="object"?x.champions:{};x.settings={autosave:true,aiPerMonth:9,...(x.settings||{})};for(const f of [x.player,...x.world]){if(!f||!f.id||!f.record||!f.attrs)throw Error("Bokschi ma’lumoti noto‘g‘ri");f.fights=Array.isArray(f.fights)?f.fights:[];f.titles=Array.isArray(f.titles)?f.titles:[];f.record={w:0,l:0,d:0,nc:0,ko:0,koLoss:0,...f.record};f.injuryMonths=Number(f.injuryMonths)||0;}return x;}
let S=blankState(), page="dashboard", selectedDivision=8, rankingTab="Lightweight", fightTactic="Balanced", pendingTraining=null;
function makeFighter(o={}){
 const style=o.style||pick(STYLES), attrs={};
 ATTRS.forEach(k=>attrs[k]=clamp(Math.round((o.attrs&&o.attrs[k]!==undefined?o.attrs[k]:int(42,72))+(STYLEMOD[style]?.[k]||0)),20,96));
 return {id:o.id||uid(),name:o.name||pick(FIRST)+" "+pick(LAST),nickname:o.nickname||"",country:o.country||pick(COUNTRIES),city:o.city||pick(CITIES),age:o.age||int(20,31),height:o.height||int(163,198),reach:o.reach||int(165,205),stance:o.stance||pick(["Orthodox","Southpaw"]),style,division:o.division??8,attrs,record:o.record||{w:0,l:0,d:0,nc:0,ko:0,koLoss:0},rating:o.rating||Math.round(avg(Object.values(attrs))),potential:o.potential||int(60,91),popularity:o.popularity||int(8,32),money:o.money??int(500,5000),earnings:o.earnings||0,condition:o.condition??90,fatigue:o.fatigue||0,injury:o.injury||null,injuryMonths:o.injuryMonths||0,active:o.active!==false,retired:!!o.retired,rank:o.rank||null,titles:o.titles||[],titleDefenses:o.titleDefenses||0,streak:o.streak||0,lossStreak:o.lossStreak||0,fights:o.fights||[],careerStage:o.careerStage||"Prospect",lastFightMonth:o.lastFightMonth||0,createdYear:o.createdYear||2026,trainingThisMonth:o.trainingThisMonth||0,bestRank:o.bestRank||null};
}
function logNews(head,body=""){S.news.unshift({id:uid(),date:dateStr(),head,body});S.news=S.news.slice(0,90);S.events.unshift({date:dateStr(),text:head});S.events=S.events.slice(0,200)}
function dateStr(){return `${String(S.month).padStart(2,"0")}/${S.year}`}
function fullDate(){return `${S.year}-${String(S.month).padStart(2,"0")}`}
function ledger(kind,amount,desc){if(!S.player)return;S.player.money=Math.round(S.player.money+amount);S.ledger.unshift({date:dateStr(),kind,amount,desc});S.ledger=S.ledger.slice(0,250)}
function allFighters(){return S.player?[S.player,...S.world]:S.world}
function fighterById(id){return allFighters().find(f=>f.id===id)}
function recordText(f){return `${f.record.w}-${f.record.l}-${f.record.d}${f.record.nc?` (${f.record.nc} NC)`:""}`}
function recordTotal(f){return f.record.w+f.record.l+f.record.d+f.record.nc}
function fighterRating(f){let base=avg(Object.values(f.attrs));return Math.round(base*.72+f.popularity*.08+f.record.w*.25+f.titles.length*2+f.condition*.04-f.fatigue*.08)}
function generateWorld(){
 S.world=[]; S.champions={}; S.rankings={};
 DIVISIONS.forEach((d,di)=>{
   let list=[]; for(let i=0;i<22;i++){let f=makeFighter({division:di,age:int(20,35),attrs:Object.fromEntries(ATTRS.map(k=>[k,int(42,82)])),potential:int(60,94),popularity:int(8,60),money:int(1000,90000),createdYear:S.year-int(1,10)}); f.record={w:int(0,18),l:int(0,4),d:int(0,2),nc:0,ko:0,koLoss:0};f.record.ko=Math.min(f.record.w,int(0,Math.ceil(f.record.w*.7)));f.rating=fighterRating(f);list.push(f);S.world.push(f)}
   list.sort((a,b)=>fighterRating(b)-fighterRating(a));let champ=list[0];champ.titles=[pick(ORGS)];S.champions[di]={};S.champions[di][champ.titles[0]]=champ.id;
   // Other belts may be held by distinct top contenders; sometimes leave vacant.
   ORGS.filter(x=>x!==champ.titles[0]).forEach(org=>{if(Math.random()>.16){let holder=list.find(f=>f.id!==champ.id&&!f.titles.length);if(holder){holder.titles.push(org);S.champions[di][org]=holder.id}}});
 });
 recalcRankings();
}
function recalcRankings(){
 S.rankings={};
 DIVISIONS.forEach((d,di)=>{
  let list=S.world.filter(f=>f.division===di&&f.active&&!f.retired);
  if(S.player&&S.player.division===di&&!S.player.retired)list.push(S.player);
  list.sort((a,b)=>rankScore(b)-rankScore(a));
  list.forEach((f,i)=>{f.rank=i+1;if(f===S.player&&(!S.bestRank||i+1<S.bestRank))S.bestRank=i+1;});
  S.rankings[di]=list.map(f=>f.id);
 });
}
function rankScore(f){return fighterRating(f)+f.record.w*1.3-f.record.l*2.3+f.streak*.8+f.titles.length*8+(f.active?0:-100)}
function newCareer(data){
 S=blankState();S.year=Number(data.year);S.month=1;
 let f=makeFighter({name:data.name.trim(),nickname:data.nickname.trim(),country:data.country.trim(),city:data.city.trim(),age:+data.age,height:+data.height,reach:+data.reach,stance:data.stance,style:data.style,division:+data.division,createdYear:+data.year,attrs:Object.fromEntries(ATTRS.map(k=>[k,clamp(int(49,64)+(STYLEMOD[data.style]?.[k]||0),25,85)])),money:12000,condition:100});
 f.popularity=12;f.record={w:0,l:0,d:0,nc:0,ko:0,koLoss:0};f.rating=fighterRating(f);f.careerHistory=[];S.player=f;
 generateWorld();recalcRankings();logNews(`${f.name} professional boksga qadam qo‘ydi`,`Yangi istiqbolli bokschi ${f.city} shahridan.`);createOffers();save(true);page="dashboard";render();toast("Karyera yaratildi. Ringga xush kelibsiz!");
}
function createOffers(){
 if(!S.player||S.player.retired||S.activeFight)return;
 const p=S.player;let eligible=S.world.filter(f=>f.active&&!f.retired&&!f.injury&&f.division===p.division&&!f.fights.some(x=>x.date===fullDate()&&x.pending));
 eligible.sort(()=>Math.random()-.5);let chosen=eligible.slice(0,5);
 S.offers=chosen.map(o=>({id:uid(),opponentId:o.id,division:p.division,rounds:pick([4,6,8,10]),venue:pick(VENUES),year:S.year,month:Math.min(12,S.month+int(1,3)),purse:Math.round((1500+p.popularity*100+fighterRating(o)*45+int(0,2200))*(1+Math.random()*.25)),bonus:Math.random()>.55?int(500,2500):0,status:"Offer",title:false}));
 if(!S.offers.length)logNews("Matchmaker yangi raqiblarni qidirmoqda","Hozircha mos raqib topilmadi.");
}
function offerAccept(id){
 const o=S.offers.find(x=>x.id===id),p=S.player,opp=o&&fighterById(o.opponentId);
 if(!o||!p||!opp||!opp.active||opp.retired||opp.injury||S.activeFight||p.injury||p.retired)return toast("Bu shartnomani hozir qabul qilib bo‘lmaydi.",true);
 if(o.division!==p.division)return toast("Vazn toifasi mos emas.",true);
 if(o.title&&!canTitleFight(p,o.division))return toast("Title Shot uchun talablar bajarilmagan.",true);
 o.status="Accepted";o.fightDate=`${o.year}-${String(o.month).padStart(2,"0")}`;S.activeFight={offerId:o.id,offer:{...o},playerId:p.id,opponentId:opp.id,round:1,maxRounds:o.rounds,playerTactic:"Balanced",opponentTactic:"Balanced",rounds:[],started:false,finished:false,damageP:0,damageO:0,knockdownsP:0,knockdownsO:0,judges:[{p:0,o:0},{p:0,o:0},{p:0,o:0}],totalP:0,totalO:0};S.offers=S.offers.filter(x=>x.id!==id);logNews(`Jang rasman tasdiqlandi: ${p.name} vs ${opp.name}`,`${o.rounds} raund · ${o.venue} · ${dateStr()}`);save(true);page="fight";render();
}
function canTitleFight(p,di){let r=S.rankings[di]||[];return p.rank<=5&&p.record.w>=8}
function train(type){
 let p=S.player;if(!p||p.retired)return toast("Mashg‘ulot uchun faol bokschi kerak.",true);
 if(p.injury)return toast("Jarohat sabab mashg‘ulot mumkin emas.",true);
 if(p.trainingThisMonth>=8)return toast("Bu oy uchun 8 ta mashg‘ulot limiti tugadi.",true);
 if(p.fatigue>82)return toast("Charchoq yuqori. Avval dam oling.",true);
 const map={Strength:["Power","Chin"],Speed:["Speed","Accuracy"],Technique:["Technique","Accuracy"],Endurance:["Stamina","Recovery"],Defense:["Defense","Chin"],Counterpunching:["Counterpunching","Accuracy"],Clinch:["Clinch","Stamina"],Sparring:["Technique","Defense","Speed"]};
 const cost=type==="Sparring"?950:450; if(p.money<cost)return toast("Mablag‘ yetarli emas.",true);
 ledger("expense",-cost,`${type} mashg‘uloti`);

function creation(){
 return `<section class="panel hero"><div class="tag goldtag">NEW CAREER · ${S.year}</div><h2>Afsonangizni boshlang.</h2><p>O‘z bokschingizni yarating, jamoa tuzing, janglarda g‘alaba qozoning va chempionlik sari ko‘tariling. Bu dunyo to‘liq simulyatsiya qilingan.</p></section><section class="panel"><h2>Bokschi yaratish</h2><p class="muted">Majburiy maydonlarni to‘ldiring. Boshlang‘ich atributlar tanlangan uslubga mos ravishda yaratiladi.</p><form id="createForm"><div class="formgrid">

function profile(){

}
function offersPage(){
 let p=S.player;if(!p)return creation();

function fightPage(){

s="muted">Urinishlar: ${last.p.attempt} — ${last.o.attempt} · Taktika: ${esc(last.tacticP)} vs ${esc(last.tacticO)} · Knockdown: ${last.kdP} — ${last.kdO}</small></div>`:""}<div class="roundlog">${F.rounds.slice().reverse().map(r=>`<p><b>${r.round}-raund:</b> ${esc(r.comment)} <span class="muted">(${r.p.land}-${r.o.land})</span></p>`).join("")||'<p>Qo‘ng‘iroq chalinishini kutmoqda…</p>'}</div></section>`;

function rankingsPage(){

function p4pScore(f){return fighterRating(f)+f.record.w*1.1-f.record.l*2+f.titles.length*10+Math.min(15,f.streak*2)}
function p4pRank(p){if(!p)return null;return allFighters().filter(f=>f.active&&!f.retired).sort((a,b)=>p4pScore(b)-p4pScore(a)).findIndex(f=>f.id===p.id)+1}

 if(Math.random()<.10){p.injury=pick(["Qo‘l shikastlanishi","Yuz jarohati","Qovurg‘a lat yeyishi"]);p.injuryMonths=int(1,2);logNews(`${p.name} jangdan keyin jarohat oldi`,p.injury);}
 if(Math.random()<.08){o.injury=pick(["Qo‘l shikastlanishi","Yuz jarohati","Qovurg‘a lat yeyishi"]);o.injuryMonths=int(1,2);}
 const resultP=pWin?`W — ${official}`:winner?`L — ${official}`: `D — ${official}`,resultO=oWin?`W — ${official}`:winner?`L — ${official}`:`D — ${official}`;

simulateAIFight=function(){
 const eligible=S.world.filter(f=>f.active&&!f.retired&&!f.injury&&f.condition>25&&f.age<60);
 if(eligible.length<2)return false;
 const a=pick(eligible),opts=eligible.filter(b=>b.id!==a.id&&b.division===a.division&&!b.fights.some(x=>x.date===fullDate()));if(!opts.length)return false;
 opts.sort((x,y)=>Math.abs(fighterRating(x)-fighterRating(a))-Math.abs(fighterRating(y)-fighterRating(a)));const b=opts[0];
 const ra=fighterRating(a),rb=fighterRating(b),pa=clamp(.5+(ra-rb)*.008+(a.attrs.Accuracy-b.attrs.Defense)*.002+(a.attrs.Stamina-b.attrs.Stamina)*.001,.18,.82),r=Math.random();
 const winner=r<pa?a:r>1-pa?b:null;let method=winner?(Math.random()<.18?"KO":Math.random()<.15?"TKO":"Decision"):"Draw";
 if(winner&&Math.random()<.012)method="DQ";
 for(const f of [a,b])blSafeRecord(f);
 if(!winner){a.record.d++;b.record.d++;a.streak=b.streak=0;a.lossStreak=b.lossStreak=0;}
 else{winner.record.w++;const loser=winner===a?b:a;loser.record.l++;winner.streak++;winner.lossStreak=0;loser.lossStreak++;loser.streak=0;if(["KO","TKO"].includes(method)){winner.record.ko++;loser.record.koLoss++;}}
 const round=method==="Decision"?int(4,10):int(1,Math.min(10,12));
 const venue=pick(VENUES);
 for(const [f,opp] of [[a,b],[b,a]]){const win=f===winner;f.fights.unshift({id:uid(),date:fullDate(),opponentId:opp.id,opponent:opp.name,opponentRecordAtTime:recordText(opp),result:winner?`${win?"W":"L"} — ${method}`:"D — Draw",method,round,venue,division:f.division,knockdownsFor:method==="KO"&&win?1:0,knockdownsAgainst:method==="KO"&&!win?1:0});f.fights=f.fights.slice(0,250);f.lastFightMonth=S.month+S.year*12;f.condition=clamp(f.condition-int(8,18),5,100);f.fatigue=clamp(f.fatigue+int(8,17),0,100);f.popularity=clamp(f.popularity+(win?2: winner?-1:0),0,100);}
 if(winner){const purse=int(800,4000);winner.money+=purse;winner.earnings=(winner.earnings||0)+purse;}
 // Champions may only lose belts in a simulated bout if opponent is a ranked challenger.
 const belts=S.champions[a.division]||{};ORGS.forEach(org=>{const champ=belts[org];if(!champ||!winner)return;const loser=winner===a?b:a;if(champ===loser.id&&winner.rank&&winner.rank<=10)blSetChampion(a.division,org,winner.id,`${winner.name} AI chempionlik jangida g‘alaba qozondi.`);});
 recalcRankings();return true;
};
advanceMonth=function(){
 if(!S.player||S.retired||S.player.retired)return toast("Faol karera kerak.",true);if(S.activeFight)return toast("Faol jangni yakunlang.",true);
 S.month++;if(S.month>12){S.month=1;S.year++;}
 const p=S.player;p.trainingThisMonth=0;if(S.month===1&&p.age<100)p.age++;
 p.fatigue=clamp(p.fatigue-20-p.attrs.Recovery*.08,0,100);p.condition=clamp(p.condition+20,0,100);
 if(p.injury){p.injuryMonths=Math.max(0,p.injuryMonths-1);if(!p.injuryMonths){p.injury=null;logNews(`${p.name} jarohatdan to‘liq tiklandi`);}}
 if(p.age>32)ATTRS.forEach(a=>{const delta=p.age<36&&p.potential>avg(Object.values(p.attrs))?.08:-.18;p.attrs[a]=clamp(p.attrs[a]+delta,20,100);});
 // AI develops, heals, declines and occasionally retires.
 S.world.forEach(f=>{if(S.month===1&&f.age<100)f.age++;f.fatigue=clamp(f.fatigue-16,0,100);f.condition=clamp(f.condition+14,5,100);if(f.injuryMonths>0){f.injuryMonths--;if(!f.injuryMonths)f.injury=null;}if(f.age>37&&Math.random()<.035){f.active=false;f.retired=true;f.titles.slice().forEach(org=>blSetChampion(f.division,org,null,`${f.name} nafaqaga chiqdi.`));logNews(`${f.name} faoliyatini yakunladi`);}else if(f.age<30&&Math.random()<.22){const a=pick(ATTRS);f.attrs[a]=clamp(f.attrs[a]+Math.random()*.3,20,98);}else if(f.age>34&&Math.random()<.25){const a=pick(["Speed","Stamina","Recovery"]);f.attrs[a]=clamp(f.attrs[a]-.25,20,98);}});
 const aiN=clamp(Number(S.settings.aiPerMonth)||9,0,30);let completed=0,guard=0;while(completed<aiN&&guard<aiN*5+5){if(simulateAIFight())completed++;guard++;}
 S.sponsors.forEach(sp=>{if(sp.active&&sp.months>0){ledger("income",sp.monthly,`${sp.name} homiylik`);sp.months--;if(sp.months<=0){sp.active=false;logNews(`${sp.name} homiylik shartnomasi yakunlandi`);}}});

 S.world.forEach(f=>{if(f.retired||!f.active)(f.titles||[]).slice().forEach(org=>blSetChampion(f.division,org,null,"Chempion faol emas; kamar bo‘shatildi."));});
 recalcRankings();S.offers=[];createOffers();logNews(`${dateStr()} — yangi oy`,`${completed} ta AI jangi simulyatsiya qilindi.`);save(true);render();toast(`${dateStr()} ga o‘tildi.`);
};
train=function(type){
 const p=S.player;if(!p||p.retired)return toast("Faol bokschi kerak.",true);if(p.injury)return toast("Jarohat sabab mashg‘ulot mumkin emas.",true);
 if(p.trainingThisMonth>=8)return toast("Bu oy uchun 8 ta mashg‘ulot limiti tugadi.",true);if(p.fatigue>82)return toast("Charchoq yuqori. Avval dam oling.",true);
 const map={Strength:["Power","Chin"],Speed:["Speed","Accuracy"],Technique:["Technique","Accuracy"],Endurance:["Stamina","Recovery"],Defense:["Defense","Chin"],Counterpunching:["Counterpunching","Accuracy"],Clinch:["Clinch","Stamina"],Sparring:["Technique","Defense","Speed"]};

 p.fatigue=clamp(p.fatigue+int(type==="Sparring"?13:7,type==="Sparring"?22:14),0,100);p.condition=clamp(p.condition-int(3,8),5,100);p.trainingThisMonth++;

};
